name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: 测试
        run: |
          export HOME="$HOME"
          go vet ./...
          go test ./...

      - name: 交叉编译并打包
        run: |
          set -eu
          mkdir -p dist
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              bin=clashgo
              [ "$os" = windows ] && bin=clashgo.exe
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
                go build -trimpath \
                -ldflags "-s -w -X clashgo/cmd.Version=$GITHUB_REF_NAME" \
                -o "dist/$bin" .
              # 产物名必须与 internal/selfupdate.AssetName() 一致
              ( cd dist && tar czf "clashgo-$os-$arch.tar.gz" "$bin" && rm -f "$bin" )
            done
          done
          ( cd dist && sha256sum *.tar.gz > checksums.txt && cat checksums.txt )

      - name: 发布
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/checksums.txt
          generate_release_notes: true
